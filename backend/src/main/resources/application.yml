spring:
  application:
    name: enterprise-ai-cockpit
  autoconfigure:
    exclude:
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.StdioTransportAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.McpClientAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.annotations.McpClientAnnotationScannerAutoConfiguration
      - org.springframework.ai.mcp.client.httpclient.autoconfigure.SseHttpClientTransportAutoConfiguration
      - org.springframework.ai.mcp.client.httpclient.autoconfigure.StreamableHttpHttpClientTransportAutoConfiguration
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/enterprise_ai_cockpit}
    username: ${POSTGRES_USER:enterprise_ai}
    password: ${POSTGRES_PASSWORD:enterprise_ai_123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:${AI_DASHSCOPE_API_KEY:demo-key}}
      base-url: ${OPENAI_BASE_URL:https://api.okinto.com/v1}
      chat:
        options:
          model: ${LLM_MODEL:gpt-5.4-mini}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}

server:
  port: ${SERVER_PORT:8080}

app:
  repository:
    mode: ${APP_REPOSITORY_MODE:memory}
  llm:
    enabled: ${LLM_ENABLED:false}
    provider: ${LLM_PROVIDER:openai-compatible}
    base-url: ${OPENAI_BASE_URL:https://api.okinto.com/v1}
    api-key: ${OPENAI_API_KEY:demo-key}
    model: ${LLM_MODEL:gpt-5.4-mini}
  speech:
    provider: ${SPEECH_PROVIDER:mock-openai-compatible}
  rag:
    top-k: ${RAG_TOP_K:6}
  mcp:
    enabled: ${MCP_ENABLED:false}
